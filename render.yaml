services:
  - type: web
    name: yonetim-bilgi-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Security__NationalIdHashPepper
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: Security__DataProtectionCertificateBase64
        sync: false
      - key: Security__DataProtectionCertificatePassword
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__SecretKey
        sync: false
      - key: Supabase__Bucket
        sync: false
      - key: Supabase__DatabaseCaCertificateBase64
        sync: false
